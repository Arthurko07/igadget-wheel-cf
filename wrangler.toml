name = "igadget-wheel"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Статика: колесо и админка
assets = { directory = "./public" }

[vars]
ADMIN_IDS = "ВАШ_TELEGRAM_ID"   # узнать: @userinfobot; несколько — через запятую
DAILY_SPIN_LIMIT = "3"          # спинов в день на пользователя

# База данных (database_id вставьте после команды wrangler d1 create)
[[d1_databases]]
binding = "DB"
database_name = "igadget-wheel"
database_id = "ВСТАВЬТЕ_ID"

# Картинки призов в R2. Если Cloudflare попросит карту за R2 —
# закомментируйте блок ниже, и картинки автоматически будут
# сохраняться на Telegraph (тоже бесплатно и навсегда).
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "igadget-wheel-images"
