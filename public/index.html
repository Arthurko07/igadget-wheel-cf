<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>iGadget • Колесо Фортуны</title>
<link rel="stylesheet" href="style.css"/>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div class="bg-glow bg-glow--1"></div>
<div class="bg-glow bg-glow--2"></div>

<div class="app">
  <header class="topbar">
    <div class="logo">⚡️ iGadget <span>WHEEL</span></div>
    <div class="spins-badge">🎟 Осталось: <b id="spinsLeft">—</b></div>
  </header>

  <main>
    <div class="wheel-zone">
      <div class="pointer">
        <svg width="34" height="40" viewBox="0 0 34 40" fill="none">
          <path d="M17 40 L2 8 Q17 -4 32 8 Z" fill="url(#pg)"/>
          <defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1">
            <stop stop-color="#54FF9F"/><stop offset="1" stop-color="#00C46A"/>
          </linearGradient></defs>
        </svg>
      </div>

      <div class="wheel-halo"></div>
      <div class="rotor" id="rotor"><canvas id="wheel"></canvas></div>

      <button class="spin-btn" id="spinBtn"><span class="spin-btn__label">SPIN</span></button>
    </div>

    <section class="panel">
      <h2>Призы в розыгрыше</h2>
      <div class="prize-grid" id="prizeList"></div>
    </section>
  </main>
</div>

<!-- Модалка выигрыша -->
<div class="modal" id="winModal">
  <div class="modal__card">
    <div class="modal__rays"></div>
    <div class="modal__emoji" id="winEmoji">🎉</div>
    <img class="modal__img hidden" id="winImg" alt=""/>
    <h3>Поздравляем!</h3>
    <p>Вам выпало:</p>
    <div class="modal__prize" id="winName"></div>
    <p class="modal__hint">Сделайте скриншот и отправьте боту, чтобы забрать приз 😉</p>
    <button class="btn btn--primary" id="winClose">Забрать приз</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
